<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Master Vendor Login — AutoVolt Cloud HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900/90 border border-purple-900/40 backdrop-blur-xl rounded-3xl p-8 shadow-2xl space-y-6">
        <!-- Logo -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-purple-500 flex items-center justify-center text-white font-black text-3xl mx-auto shadow-xl shadow-purple-600/30">
                ☁️
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">AutoVolt Cloud HQ</h1>
            <p class="text-xs text-purple-300 font-semibold tracking-wide">SaaS Master Vendor & Company Management</p>
        </div>

        {% if error %}
        <div class="p-3 bg-rose-950/80 border border-rose-800/80 rounded-xl text-xs text-rose-300 font-medium text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4 text-xs font-medium">
            <div>
                <label class="block text-slate-300 font-bold mb-1">Master Vendor Username</label>
                <input type="text" name="username" required autofocus placeholder="admin" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm font-medium">
            </div>

            <div>
                <label class="block text-slate-300 font-bold mb-1">Master Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm font-medium">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-500 hover:from-purple-500 hover:to-indigo-500 text-white font-black text-sm rounded-2xl shadow-xl shadow-purple-600/30 transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>Access Master Vendor HQ ☁️</span>
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800 text-center text-[11px] text-slate-500">
            <p>Protected Vendor Area. Default: <b>admin</b> / <b>admin123</b></p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
