<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — AutoVolt Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-amber-500 text-slate-950 font-black text-2xl flex items-center justify-center mx-auto">
                ⚡
            </div>
            <h1 class="text-xl font-black text-white">Enter New Password</h1>
            <p class="text-xs text-slate-400">{% if user %}Account: <b>{{ user.username }}</b>{% else %}Enter your new account password below{% endif %}</p>
        </div>

        {% if error %}
        <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs font-semibold">
            {{ error }}
        </div>
        {% endif %}

        <form action="/reset-password" method="POST" class="space-y-4 text-xs font-medium">
            <input type="hidden" name="token" value="{{ token or '' }}">
            <div>
                <label class="block text-slate-300 font-bold mb-1">New Password *</label>
                <input type="password" name="new_password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label class="block text-slate-300 font-bold mb-1">Confirm New Password *</label>
                <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow transition">
                Save & Sign In ⚡
            </button>
        </form>

        <div class="text-center">
            <a href="/login" class="text-xs text-slate-400 hover:text-white underline">Back to Sign In</a>
        </div>
    </div>
</body>
</html>
