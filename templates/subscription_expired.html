<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Expired — AutoVolt Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-rose-900/60 rounded-3xl p-8 shadow-2xl text-center space-y-5">
        <div class="w-16 h-16 rounded-3xl bg-rose-500/20 text-rose-500 flex items-center justify-center font-black text-3xl mx-auto border border-rose-500/40">
            ⚠️
        </div>
        <h1 class="text-2xl font-black text-white">Subscription Period Ended</h1>

        </p>

        <div class="p-4 bg-slate-800/80 rounded-2xl border border-slate-700 text-xs text-slate-300 space-y-1">
            <p class="font-bold text-white">AutoVolt Pro Support / Renewal:</p>
            <p>📞 Phone: +91 98765 00000</p>
            <p>📧 Email: admin@autovolt.com</p>
        </div>

        <div class="pt-2">
            <a href="/login" class="inline-block px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition">
                Sign In with Admin Account
            </a>
        </div>
    </div>
</body>
</html>
