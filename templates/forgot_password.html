<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp OTP Password Reset — AutoVolt Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-3xl p-8 shadow-2xl space-y-6">
        <!-- Logo -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black text-2xl mx-auto shadow-lg shadow-emerald-500/20">
                📲
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Forgot Password</h1>
            <p class="text-xs text-slate-400">Receive a secure 6-digit verification code on your registered WhatsApp mobile number</p>
        </div>

        {% if error %}
        <div class="p-3 bg-rose-950/80 border border-rose-800/80 rounded-xl text-xs text-rose-300 font-medium text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/forgot-password" method="POST" class="space-y-4 text-xs font-medium">
            <div>
                <label class="block text-slate-300 font-bold mb-1">Username or WhatsApp Mobile Number</label>
                <input type="text" name="username_or_mobile" required autofocus placeholder="e.g. admin or +91 98765 00000" class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-medium">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black text-sm rounded-2xl shadow-lg shadow-emerald-500/20 transition transform active:scale-95 flex items-center justify-center gap-2">
                <i data-lucide="message-square" class="w-4 h-4"></i>
                <span>Send WhatsApp OTP 📲</span>
            </button>

            <div class="text-center pt-2">
                <a href="/login" class="text-slate-400 hover:text-white text-xs transition">← Back to Login</a>
            </div>
        </form>

        <div class="pt-4 border-t border-slate-800 text-center text-[11px] text-slate-500">
            <p>AutoVolt Pro Multi-Tenant Cloud Security</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
