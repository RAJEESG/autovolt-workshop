<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AutoVolt Pro Workshop SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-3xl p-8 shadow-2xl space-y-6">
        <!-- Logo -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-black text-2xl mx-auto shadow-lg shadow-amber-500/20">
                ⚡
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">AutoVolt Pro</h1>
            <p class="text-xs text-amber-400 font-medium">Auto Electrical Workshop Management SaaS</p>
        </div>

        {% if error %}
        <div class="p-3 bg-rose-950/80 border border-rose-800/80 rounded-xl text-xs text-rose-300 font-medium text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        {% if success_msg %}
        <div class="p-3 bg-emerald-950/80 border border-emerald-800/80 rounded-xl text-xs text-emerald-300 font-medium text-center">
            ✅ {{ success_msg }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4 text-xs font-medium">
            <div>
                <label class="block text-slate-300 font-bold mb-1">Username / Mobile</label>
                <input type="text" name="username" required autofocus placeholder="e.g. admin or staff" class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-slate-300 font-bold">Password</label>
                    <a href="/forgot-password" class="text-amber-400 hover:underline text-[11px]">Forgot Password?</a>
                </div>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black text-sm rounded-2xl shadow-lg shadow-amber-500/20 transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>Sign In to Workshop ⚡</span>
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500 space-y-1">
            <p>Default Login: <b>admin</b> / <b>admin123</b></p>
            <p>Master PIN for Deletions: <b>1234</b></p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
